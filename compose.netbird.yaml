# cargo-live-agent inside a NetBird network, for shared or CI agents that must
# reach private resources (internal GitLab, registries) without a developer
# machine in the loop. The `netbird` service joins the network non-interactively
# with a setup key; the agent shares its network namespace, so all of the
# agent's traffic and DNS go through NetBird.
#
#   printf '%s\n' "$NB_SETUP_KEY" > netbird-setup-key && chmod 600 netbird-setup-key
#   NB_MANAGEMENT_URL=https://netbird.example.com docker compose -f compose.netbird.yaml up -d --build --wait
#   docker compose -f compose.netbird.yaml exec agent cargo-live-agent token create --name ci
#   docker compose -f compose.netbird.yaml exec agent getent hosts gitlab.example.com
#
# The setup key is a Docker secret read from a file (NETBIRD_SETUP_KEY_FILE,
# default ./netbird-setup-key, git- and docker-ignored); it is never part of
# the image or of this file. NetBird reads it via NB_SETUP_KEY_FILE.
#
# DNS: NetBird finds no systemd-resolved in its container and rewrites the
# container's /etc/resolv.conf in place ("# Generated by NetBird", nameserver =
# its own resolver, the original nameservers as upstream for other names).
# Containers with `network_mode: service:netbird` bind-mount the very same
# resolv.conf file, so the agent uses NetBird's resolver too; `dns:` cannot be
# set on such a container. The healthcheck waits for that rewrite before the
# agent starts.
#
# Restart the pair with `docker compose ... restart netbird` (or `up`): a
# container sharing another's network namespace loses its network when that
# container is restarted behind Compose's back (`docker restart`, or the
# daemon's restart policy after a crash) until it is restarted itself.
services:
  netbird:
    # Exact version; the digest pins the multi-arch index of 0.82.0.
    image: netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
    # Kernel WireGuard needs NET_ADMIN and the tun device. (NetBird's netstack
    # mode needs neither, but configures no routes and no DNS, so it does not
    # work for this setup.)
    cap_add: [NET_ADMIN, NET_RAW, BPF]
    devices:
      - /dev/net/tun:/dev/net/tun
    hostname: ${NB_HOSTNAME:-cargo-live-agent}
    environment:
      NB_MANAGEMENT_URL: ${NB_MANAGEMENT_URL:?set NB_MANAGEMENT_URL to your NetBird management URL}
      NB_SETUP_KEY_FILE: /run/secrets/nb_setup_key
      # Peer name in the NetBird dashboard.
      NB_HOSTNAME: ${NB_HOSTNAME:-cargo-live-agent}
      NB_LOG_FILE: console
      NB_LOG_LEVEL: info
    secrets:
      - nb_setup_key
    volumes:
      # Peer identity (WireGuard key, profile): without it every re-creation
      # registers a new peer with a new NetBird IP.
      - netbird-state:/var/lib/netbird
    ports:
      # The agent's port. A container in another one's network namespace
      # cannot publish ports itself.
      - "${CARGO_LIVE_AGENT_PUBLISH:-2222}:2222"
    healthcheck:
      test:
        - CMD-SHELL
        - netbird status --check startup >/dev/null && grep -q '^# Generated by NetBird' /etc/resolv.conf
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  agent:
    build: .
    image: ${CARGO_LIVE_AGENT_IMAGE:-cargo-live-agent}
    # All traffic and DNS through the netbird container.
    network_mode: service:netbird
    # Reaps orphaned build processes (the agent is otherwise PID 1).
    init: true
    depends_on:
      netbird:
        condition: service_healthy
        # Re-create the agent's namespace when netbird is restarted by Compose.
        restart: true
    environment:
      CARGO_LIVE_AGENT_MAX_CONCURRENT_BUILDS: "2"
      # Direct connections the build proxy may make from inside the VPN
      # (default: everything).
      # CARGO_LIVE_AGENT_NETWORK_DIRECT: "*.example.com,static.crates.io,index.crates.io"
    volumes:
      - data:/data
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    restart: unless-stopped

secrets:
  nb_setup_key:
    file: ${NETBIRD_SETUP_KEY_FILE:-./netbird-setup-key}

volumes:
  netbird-state:
  data:
  cargo-registry:
  cargo-git:
