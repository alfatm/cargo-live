[package]
name = "cargo-live-proto"
description = "Protocol shared by cargo-live and cargo-live-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
globset = "0.4.21"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["io-util", "time", "macros", "net"] }
zeroize = "1.9.2"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }
