[package]
name = "cargo-live-agent"
description = "Remote build agent for cargo-live with a built-in SSH server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
cargo-live-proto = { path = "../cargo-live-proto" }
clap = { version = "4.6.8", features = ["derive", "env"] }
getrandom = "0.4.3"
libc = "0.2.191"
postcard = { version = "1.1.3", features = ["use-std"] }
russh = { version = "0.65.2", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
