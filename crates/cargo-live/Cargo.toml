[package]
name = "cargo-live"
description = "Build Rust projects remotely and run their binaries locally"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
blake3 = "1.8.7"
cargo-live-proto = { path = "../cargo-live-proto" }
libc = "0.2.191"
rpassword = "7.5.5"
russh = { version = "0.65.2", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
